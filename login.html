<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Platform - Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #333333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
    }

    .auth-container {
      width: 100%;
      max-width: 360px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo-img {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      margin-bottom: 8px;
    }

    .logo-title {
      font-size: 1rem;
      font-weight: 600;
      color: #555555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .auth-form {
      width: 100%;
    }

    .input-field {
      display: flex;
      align-items: center;
      background-color: #f7f8fa;
      border: 1px solid #e8ecef;
      border-radius: 8px;
      padding: 0 14px;
      height: 48px;
      margin-bottom: 14px;
      position: relative;
    }

    .input-icon {
      width: 20px;
      height: 20px;
      color: #a0aec0;
      margin-right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .input-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .input-field input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 0.88rem;
      color: #2d3748;
      outline: none;
    }

    .input-field input::placeholder {
      color: #a0aec0;
    }

    .eye-btn {
      background: none;
      border: none;
      color: #a0aec0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .eye-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .remember-option {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.825rem;
      color: #718096;
      margin-bottom: 20px;
      user-select: none;
    }

    .remember-option input[type="checkbox"] {
      accent-color: #ff5733;
      cursor: pointer;
    }

    .main-btn {
      width: 100%;
      height: 46px;
      background-color: #ff7654;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background-color 0.2s;
    }

    .main-btn:disabled {
      background-color: #fca5a5;
      cursor: not-allowed;
    }

    .main-btn:hover:not(:disabled) {
      background-color: #e86343;
    }

    .secondary-btn {
      width: 100%;
      height: 46px;
      background-color: #ffffff;
      color: #20c997;
      border: 1px solid #20c997;
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .secondary-btn:hover {
      background-color: #f0fdf4;
    }
  </style>
</head>
<body>

  <div class="screen">
    <div class="auth-container">
      <div class="logo-box">
        <img src="welcm.jpg" alt="Logo" class="logo-img" />
        <span class="logo-title">PEP</span>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
        <div class="input-field">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
          </span>
          <input type="tel" id="login-phone" placeholder="Please enter your phone number" pattern="[0-9]{9,10}" maxlength="10" required />
        </div>

        <div class="input-field">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </span>
          <input type="password" id="login-password" placeholder="Please enter the login password" required />
          <button type="button" class="eye-btn" onclick="togglePasswordVisibility('login-password', this)">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>

        <label class="remember-option">
          <input type="checkbox" id="remember-me" checked />
          Remember username/password
        </label>

        <button type="submit" id="login-submit-btn" class="main-btn">Log In</button>
        <button type="button" class="secondary-btn" onclick="window.location.href='sign-up.html'">Register now</button>
      </form>
    </div>
  </div>

  <!-- External Centralized Dependencies -->
  <script src="config.js"></script>
  <script src="validation.js"></script>
  <script src="toast.js"></script>
  
  <script>
    function resolveBaseUrl() {
      if (typeof API_BASE_URL !== 'undefined' && API_BASE_URL) {
        return API_BASE_URL;
      }
      const hostname = window.location.hostname;
      if (hostname === 'localhost' || hostname === '127.0.0.1') {
        return 'http://localhost:5000';
      }
      return 'https://backend-production-7c73b.up.railway.app';
    }

    window.togglePasswordVisibility = function(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (input) {
        input.type = input.type === 'password' ? 'text' : 'password';
      }
    };

    window.handleLogin = async function(e) {
      e.preventDefault();
      const phone = document.getElementById('login-phone').value.trim();
      const password = document.getElementById('login-password').value;
      const submitBtn = document.getElementById('login-submit-btn');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      const baseUrl = resolveBaseUrl();

      try {
        const response = await fetch(`https://backend-production-7c73b.up.railway.app/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });

        const data = await response.json();

        if (response.ok && (data.success || data.token)) {
          localStorage.clear();

          const token = data.token || data.accessToken;
          if (token) {
            localStorage.setItem('userToken', token);
            localStorage.setItem('token', token);
          }
          if (data.user) {
            localStorage.setItem('userData', JSON.stringify(data.user));
          }

          if (typeof showToast === 'function') showToast('Login successful!', 'success');
          setTimeout(() => { window.location.href = 'home.html'; }, 1000);
        } else {
          if (typeof showToast === 'function') showToast(data.message || 'Invalid login details.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
        }
      } catch (error) {
        console.error("Login Error:", error);
        if (typeof showToast === 'function') showToast('Server connection error', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
      }
    };
  </script>
</body>
</html>
