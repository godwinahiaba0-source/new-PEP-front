<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdrawal Record</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f7f9fa; display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 480px; background-color: #f7f9fa; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: #ffffff; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #f0f0f0; }
    .back-btn { font-size: 1.2rem; color: #999999; cursor: pointer; text-decoration: none; }
    .header-title { font-size: 1.1rem; font-weight: 600; color: #333333; }
    .wallet-card { background: #ffffff; margin: 12px 16px; border-radius: 16px; padding: 20px 16px 14px 16px; text-align: center; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03); }
    .balance-amount { font-size: 2.2rem; font-weight: 700; color: #00bcd4; line-height: 1.1; min-height: 2.5rem; }
    .balance-label { font-size: 0.85rem; color: #aaaaaa; margin-top: 4px; margin-bottom: 18px; }
    .action-row { display: flex; align-items: center; justify-content: center; border-top: 1px solid #f5f5f5; padding-top: 12px; }
    .action-btn { background: none; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; flex: 1; text-align: center; }
    .btn-withdraw { color: #00bcd4; }
    .tabs-header { display: flex; background: #ffffff; padding: 10px 0; margin-bottom: 8px; }
    .tab-item { flex: 1; text-align: center; font-size: 0.95rem; font-weight: 600; color: #00bcd4; padding-bottom: 8px; position: relative; }
    .tab-item::after { content: ''; position: absolute; bottom: 0; left: 30%; width: 40%; height: 3px; background-color: #00bcd4; border-radius: 2px; }
    .records-container { padding: 0 16px 20px 16px; flex: 1; }
    .record-card { background: #ffffff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
    .record-row { display: flex; justify-content: space-between; align-items: center; }
    .order-id { font-size: 0.78rem; color: #444444; font-weight: 500; }
    .record-date { font-size: 0.75rem; color: #aaaaaa; }
    .record-amount { font-size: 1.1rem; font-weight: 700; color: #e57373; margin-top: 6px; }
    .status-approved { font-size: 0.8rem; color: #2e7d32; font-weight: 500; }
    .status-pending { font-size: 0.8rem; color: #f1b346; font-weight: 500; }
    .status-failed { font-size: 0.8rem; color: #d32f2f; font-weight: 500; }
    .no-more-data { text-align: center; font-size: 0.75rem; color: #cccccc; margin-top: 15px; display: none; }
    .empty-msg { text-align: center; font-size: 0.85rem; color: #aaaaaa; padding: 24px 0; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <a class="back-btn" onclick="window.location.href='me.html'">❮</a>
      <span class="header-title">Withdrawal Records</span>
      <span style="width: 15px;"></span>
    </div>

    <div class="wallet-card">
      <div class="balance-amount" id="userWalletBalance">0.00</div>
      <div class="balance-label">Balance (GHS)</div>
      <div class="action-row">
        <button class="action-btn btn-withdraw" onclick="window.location.href='withdraw.html'">Withdrawal</button>
      </div>
    </div>

    <div class="tabs-header">
      <div class="tab-item">Withdrawal record</div>
    </div>

    <div class="records-container">
      <div id="withdrawal-list">
        <p class="empty-msg">Loading records...</p>
      </div>
      <div class="no-more-data" id="noMoreData">No more data</div>
    </div>
  </div>

  <script src="config.js" onerror=""></script>
  <script src="toast.js" onerror=""></script>
  <script>
    function resolveBaseUrl() {
      if (typeof API_BASE_URL !== 'undefined' && API_BASE_URL) return API_BASE_URL;
      return (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:8080' : 'http://pep-back-production.up.railway.app';
    }

    function formatDate(dateInput) {
      if (!dateInput) return '';
      const d = new Date(dateInput);
      if (isNaN(d.getTime())) return String(dateInput);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    async function loadWithdrawalData() {
      const token = localStorage.getItem('token') || localStorage.getItem('userToken');
      const baseUrl = resolveBaseUrl();
      if (!token) {
        document.getElementById('withdrawal-list').innerHTML = '<p class="empty-msg">Please log in to view records.</p>';
        return;
      }

      try {
        const profileRes = await fetch(`${baseUrl}/api/user/profile`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (profileRes.ok) {
          const profileData = await profileRes.json();
          if (profileData.user?.balance !== undefined) {
            document.getElementById('userWalletBalance').innerText = parseFloat(profileData.user.balance).toFixed(2);
          }
        }
      } catch (e) {}

      try {
        const res = await fetch(`${baseUrl}/api/withdraw/history`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) {
          const data = await res.json();
          const list = data.history || data.withdrawals || data.records || [];
          const container = document.getElementById('withdrawal-list');
          container.innerHTML = '';

          if (list.length === 0) {
            container.innerHTML = '<p class="empty-msg">No withdrawal records found.</p>';
            return;
          }

          list.forEach(item => {
            const rawStatus = (item.status || 'pending').toLowerCase();
            let statusClass = 'status-pending', statusText = 'Pending';
            if (['approved', 'paid', 'success', 'completed'].includes(rawStatus)) {
              statusClass = 'status-approved'; statusText = 'Paid';
            } else if (['failed', 'rejected', 'declined', 'cancelled'].includes(rawStatus)) {
              statusClass = 'status-failed'; statusText = 'Failed';
            }

            const card = document.createElement('div');
            card.className = 'record-card';
            card.innerHTML = `
              <div class="record-row">
                <span class="order-id">WD_${item.id || 'N/A'}</span>
                <span class="record-date">${formatDate(item.created_at)}</span>
              </div>
              <div class="record-row">
                <span class="record-amount" style="color: #e57373;">-${parseFloat(Math.abs(item.net_amount || item.amount)).toFixed(2)}</span>
                <span class="${statusClass}">${statusText}</span>
              </div>
            `;
            container.appendChild(card);
          });
          document.getElementById('noMoreData').style.display = 'block';
        }
      } catch (err) {
        document.getElementById('withdrawal-list').innerHTML = '<p class="empty-msg">Failed to load withdrawal records.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadWithdrawalData);
  </script>
</body>
</html>
