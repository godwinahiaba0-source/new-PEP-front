<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recharge Record</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f7f9fa;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: #f7f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #ffffff;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #f0f0f0;
    }

    .back-btn {
      font-size: 1.2rem;
      color: #999999;
      cursor: pointer;
      text-decoration: none;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #333333;
    }

    .wallet-card {
      background: #ffffff;
      margin: 12px 16px;
      border-radius: 16px;
      padding: 20px 16px 14px 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .balance-amount {
      font-size: 2.2rem;
      font-weight: 700;
      color: #f1b346;
      line-height: 1.1;
    }

    .balance-label {
      font-size: 0.85rem;
      color: #aaaaaa;
      margin-top: 4px;
      margin-bottom: 18px;
    }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid #f5f5f5;
      padding-top: 12px;
    }

    .action-btn {
      background: none;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }

    .btn-recharge {
      color: #f1b346;
    }

    .tabs-header {
      display: flex;
      background: #ffffff;
      padding: 10px 0;
      margin-bottom: 8px;
    }

    .tab-item {
      flex: 1;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: #00bcd4;
      padding-bottom: 8px;
      position: relative;
    }

    .tab-item::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 30%;
      width: 40%;
      height: 3px;
      background-color: #00bcd4;
      border-radius: 2px;
    }

    .records-container {
      padding: 0 16px 20px 16px;
      flex: 1;
    }

    .record-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .record-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-id {
      font-size: 0.78rem;
      color: #444444;
      font-weight: 500;
    }

    .record-date {
      font-size: 0.75rem;
      color: #aaaaaa;
    }

    .record-amount {
      font-size: 1.1rem;
      font-weight: 700;
      color: #00bcd4;
      margin-top: 6px;
    }

    .status-paid {
      font-size: 0.8rem;
      color: #2e7d32;
      font-weight: 500;
    }

    .status-pending {
      font-size: 0.8rem;
      color: #f1b346;
      font-weight: 500;
    }

    .status-failed {
      font-size: 0.8rem;
      color: #d32f2f;
      font-weight: 500;
    }

    .no-more-data {
      text-align: center;
      font-size: 0.75rem;
      color: #cccccc;
      margin-top: 15px;
    }

    .empty-msg {
      text-align: center;
      font-size: 0.85rem;
      color: #aaaaaa;
      padding: 24px 0;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div class="header">
      <a class="back-btn" onclick="window.location.href='me.html'">❮</a>
      <span class="header-title">Recharge Records</span>
      <span style="width: 15px;"></span>
    </div>

    <div class="wallet-card">
      <div class="balance-amount" id="userWalletBalance">0.00</div>
      <div class="balance-label">Balance (GHS)</div>
      
      <div class="action-row">
        <button class="action-btn btn-recharge" onclick="window.location.href='recharge.html'">Recharge</button>
      </div>
    </div>

    <!-- Recharge Record Header -->
    <div class="tabs-header">
      <div class="tab-item">Recharge record</div>
    </div>

    <div class="records-container">
      <div id="recharge-content">
        <div id="recharge-list">
          <p class="empty-msg">No recharge records found.</p>
        </div>
        <div class="no-more-data">No more data</div>
      </div>
    </div>

  </div>

  <!-- Centralized Config and Toast Imports -->
  <script src="config.js"></script>
  <script src="toast.js"></script>

  <script>
    function resolveBaseUrl() {
      if (typeof API_BASE_URL !== 'undefined' && API_BASE_URL) {
        return API_BASE_URL;
      }
      const hostname = window.location.hostname;
      if (hostname === 'localhost' || hostname === '127.0.0.1') {
        return 'http://localhost:8080';
      }
      return 'pep-back-production.up.railway.app';
    }

    // Robust Record Renderer
    function renderRecordsList(containerId, records) {
      if (!records || !Array.isArray(records) || records.length === 0) return;
      
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      records.forEach(item => {
        // Handle variations in status strings
        const rawStatus = (item.status || item.state || 'Pending').toString().toLowerCase();
        let statusClass = 'status-pending';
        let statusText = 'Pending';

        if (['paid', 'approved', 'success', 'completed', '1'].includes(rawStatus)) {
          statusClass = 'status-paid';
          statusText = 'Completed';
        } else if (['failed', 'rejected', 'declined', '2'].includes(rawStatus)) {
          statusClass = 'status-failed';
          statusText = 'Failed';
        }

        // Handle variations in amount properties
        const val = item.amount || item.recharge_amount || item.sum || item.total || 0;
        const formattedAmount = parseFloat(val).toFixed(2);

        // Handle variations in date properties
        const rawDate = item.timestamp || item.createdAt || item.created_at || item.date;
        const formattedDate = rawDate ? new Date(rawDate).toISOString().split('T')[0] : new Date().toISOString().split('T')[0];

        // Handle transaction ID
        const trxId = item.order_id || item.transactionId || item.transaction_id || item.id || ('TRX_' + Math.floor(100000 + Math.random() * 900000));

        const card = document.createElement('div');
        card.className = 'record-card';
        card.innerHTML = `
          <div class="record-row">
            <span class="order-id">${trxId}</span>
            <span class="record-date">${formattedDate}</span>
          </div>
          <div class="record-row">
            <span class="record-amount">${formattedAmount}</span>
            <span class="${statusClass}">${statusText}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Fetch Wallet Details & Recharge Records
    async function loadWalletData() {
      const token = localStorage.getItem('userToken') || localStorage.getItem('token');
      const baseUrl = resolveBaseUrl();

      // 1. Check LocalStorage fallback first
      const localRecharges = JSON.parse(localStorage.getItem('pendingRecharges') || localStorage.getItem('recharges') || '[]');
      if (localRecharges.length > 0) {
        renderRecordsList('recharge-list', localRecharges);
      }

      // 2. Fetch from Backend Wallet Details
      try {
        const response = await fetch(`pep-back-production.up.railway.app/api/wallet/details`, {
          headers: {
            'Content-Type': 'application/json',
            'Authorization': token ? `Bearer ${token}` : ''
          }
        });

        if (response.ok) {
          const data = await response.json();
          const payload = data.data || data;

          if (payload.balance !== undefined) {
            document.getElementById('userWalletBalance').innerText = parseFloat(payload.balance).toFixed(2);
          }

          const records = payload.recharges || payload.deposits || [];
          if (records.length > 0) {
            renderRecordsList('recharge-list', records);
            return;
          }
        }
      } catch (err) {
        console.warn("Wallet API endpoint unavailable, trying direct routes...", err);
      }

      // 3. Alternate Direct Endpoint Fallback
      const endpoints = [
        `pep-back-production.up.railway.app/api/recharges`,
        `pep-back-production.up.railway.app/api/wallet/recharges`,
        `pep-back-production.up.railway.app/api/user/recharges`
      ];

      for (const endpoint of endpoints) {
        try {
          const altResponse = await fetch(endpoint, {
            headers: {
              'Content-Type': 'application/json',
              'Authorization': token ? `Bearer ${token}` : ''
            }
          });

          if (altResponse.ok) {
            const altData = await altResponse.json();
            const payload = altData.data || altData;
            const records = Array.isArray(payload) ? payload : (payload.recharges || payload.deposits || []);
            if (records.length > 0) {
              renderRecordsList('recharge-list', records);
              break;
            }
          }
        } catch (err) {
          console.warn(`Failed fetch from ${endpoint}:`, err);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', loadWalletData);
  </script>

</body>
</html>
