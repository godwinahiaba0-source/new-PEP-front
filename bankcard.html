<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bind Withdrawal Account - Pepsi VIP</title>
  <!-- Font Awesome for Taskbar Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #111827;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 75px;
    }

    .app-container {
      width: 100vw;
      max-width: 480px;
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 20px;
    }

    /* HEADER BAR */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid #f3f4f6;
      margin-bottom: 24px;
    }

    .back-btn {
      color: #111827;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .header-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    /* LOADING SKELETON STATE */
    .loading-state {
      text-align: center;
      padding: 40px 0;
      font-size: 0.9rem;
      color: #6b7280;
    }

    /* FORM STYLES */
    #bindForm {
      display: none;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: #ffffff;
      color: #111827;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: #111827;
    }

    select.form-control {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%20111827' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
    }

    .dynamic-fields {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* SUBMIT BUTTON */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #111827;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background-color: #1f2937;
    }

    /* BOUND CARD STATE */
    .bound-card-container {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .bank-card {
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      color: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }

    .card-chip {
      width: 42px;
      height: 30px;
      background: linear-gradient(135deg, #f3d078 0%, #d4a338 100%);
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .card-channel {
      position: absolute;
      top: 24px;
      right: 24px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f3f4f6;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .card-detail-group {
      margin-bottom: 12px;
    }

    .card-detail-group:last-child {
      margin-bottom: 0;
    }

    .card-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #9ca3af;
      margin-bottom: 2px;
    }

    .card-value {
      font-size: 1.05rem;
      font-weight: 600;
      word-break: break-all;
      letter-spacing: 0.5px;
    }

    .lock-notice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #6b7280;
      background-color: #f9fafb;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #f3f4f6;
      text-align: center;
    }

    .lock-notice svg {
      width: 16px;
      height: 16px;
      fill: #6b7280;
    }

    /* UNIFORM BOTTOM NAVIGATION BAR */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 6px 0;
      border-top: 1px solid #e2e8f0;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #64748b;
      font-size: 11px;
      flex: 1;
    }

    .nav-item i {
      font-size: 18px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #f95722;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Top Header -->
    <div class="header">
      <a href="me.html" class="back-btn">❮</a>
      <span class="header-title">Bank Card / Wallet</span>
      <div style="width: 16px;"></div>
    </div>

    <!-- Initial Loading Indicator -->
    <div id="loadingIndicator" class="loading-state">
      Checking account binding status...
    </div>

    <!-- Binding Form -->
    <form id="bindForm" onsubmit="handleBindAccount(event)">
      <div class="form-group">
        <label class="form-label" for="channelSelect">Select Withdrawal Channel</label>
        <select id="channelSelect" class="form-control" onchange="renderChannelInputs()" required>
          <option value="MTN">MTN Mobile Money</option>
          <option value="Telecel">Telecel Cash</option>
          <option value="USDT">USDT TRC20</option>
        </select>
      </div>

      <div id="dynamicContainer" class="dynamic-fields"></div>

      <button type="submit" id="submitBtn" class="submit-btn">Bind Account</button>
    </form>

    <!-- Bound Card State -->
    <div id="boundCardContainer" class="bound-card-container">
      <div class="bank-card">
        <div class="card-chip"></div>
        <div class="card-channel" id="cardChannelBadge">--</div>
        <div id="cardDetailsContent"></div>
      </div>

      <div class="lock-notice">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        Account bound. Contact support to modify details.
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <a href="home.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a href="invite.html" class="nav-item">
        <i class="fa-solid fa-user-group"></i>
        <span>Team</span>
      </a>
      <a href="device.html" class="nav-item">
        <i class="fa-solid fa-headset"></i>
        <span>Device</span>
      </a>
      <a href="profit.html" class="nav-item">
        <i class="fa-solid fa-chart-column"></i>
        <span>Profit</span>
      </a>
      <a href="me.html" class="nav-item active">
        <i class="fa-solid fa-user"></i>
        <span>My</span>
      </a>
    </div>

  </div>

  <script src="config.js"></script>
  <script src="toast.js"></script>

  <script>
    function renderChannelInputs() {
      const channel = document.getElementById('channelSelect').value;
      const container = document.getElementById('dynamicContainer');

      if (channel === 'USDT') {
        container.innerHTML = `
          <div class="form-group">
            <label class="form-label" for="walletAddress">USDT (TRC20) Address</label>
            <input type="text" id="walletAddress" class="form-control" placeholder="Paste TRC20 wallet address" required />
          </div>
        `;
      } else {
        const labelText = channel === 'MTN' ? 'MTN Mobile Number' : 'Telecel Mobile Number';
        container.innerHTML = `
          <div class="form-group">
            <label class="form-label" for="accountName">Official Account Name</label>
            <input type="text" id="accountName" class="form-control" placeholder="Enter official name" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="phoneNumber">${labelText}</label>
            <input type="tel" id="phoneNumber" class="form-control" placeholder="e.g. 024XXXXXXX" pattern="[0-9]{9,10}" maxlength="10" required />
          </div>
        `;
      }
    }

    async function fetchUserBankCard() {
      const loadingEl = document.getElementById('loadingIndicator');
      const formEl = document.getElementById('bindForm');
      const cardContainerEl = document.getElementById('boundCardContainer');
      const token = localStorage.getItem('token') || localStorage.getItem('userToken');

      if (!token) {
        window.location.href = 'welcome.html';
        return;
      }

      const baseUrl = 'http://pep-back-production.up.railway.app';

      try {
        const response = await fetch(`http://${baseUrl}/api/bankcard`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.status === 401 || response.status === 403) {
          localStorage.removeItem('token');
          localStorage.removeItem('userToken');
          window.location.href = 'welcome.html';
          return;
        }

        loadingEl.style.display = 'none';

        if (response.ok) {
          const resData = await response.json();
          const cardData = resData.card || resData.data;

          if (cardData && cardData.account_number) {
            // Save card details into localStorage so withdraw page can access it immediately
            localStorage.setItem('userBankCard', JSON.stringify(cardData));

            formEl.style.display = 'none';
            cardContainerEl.style.display = 'flex';

            const channel = cardData.channel || 'Mobile Money';
            document.getElementById('cardChannelBadge').textContent = channel === 'USDT' ? 'USDT TRC20' : channel;

            const detailsContainer = document.getElementById('cardDetailsContent');

            if (channel === 'USDT') {
              detailsContainer.innerHTML = `
                <div class="card-detail-group">
                  <div class="card-label">TRC20 Wallet Address</div>
                  <div class="card-value">${cardData.account_number}</div>
                </div>
              `;
            } else {
              detailsContainer.innerHTML = `
                <div class="card-detail-group">
                  <div class="card-label">Official Name</div>
                  <div class="card-value">${cardData.official_name}</div>
                </div>
                <div class="card-detail-group">
                  <div class="card-label">Phone Number</div>
                  <div class="card-value">${cardData.account_number}</div>
                </div>
              `;
            }
            return;
          }
        }
      } catch (err) {
        console.error("Error fetching bankcard data:", err);
        loadingEl.innerText = "Network error loading details. Please refresh.";
        return;
      }

      formEl.style.display = 'block';
      cardContainerEl.style.display = 'none';
      renderChannelInputs();
    }

    async function handleBindAccount(event) {
      event.preventDefault();
      const token = localStorage.getItem('token') || localStorage.getItem('userToken');
      const submitBtn = document.getElementById('submitBtn');

      if (!token) {
        window.location.href = 'welcome.html';
        return;
      }

      const channel = document.getElementById('channelSelect').value;
      let official_name = '';
      let account_number = '';

      if (channel === 'USDT') {
        official_name = 'USDT Wallet';
        account_number = document.getElementById('walletAddress').value.trim();
      } else {
        official_name = document.getElementById('accountName').value.trim();
        account_number = document.getElementById('phoneNumber').value.trim();
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Binding Account...";

      const baseUrl = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : '';

      try {
        const response = await fetch(`http://pep-back-production.up.railway.app`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ channel, official_name, account_number })
        });

        if (response.ok) {
          // Instantly sync the newly bound card to localStorage for the withdrawal page
          const newlyBoundCard = {
            channel: channel,
            official_name: official_name,
            account_number: account_number
          };
          localStorage.setItem('userBankCard', JSON.stringify(newlyBoundCard));

          if (typeof showToast === 'function') {
            showToast('Withdrawal account bound successfully!', 'success');
          }
          fetchUserBankCard();
        } else {
          const errData = await response.json().catch(() => ({}));
          if (typeof showToast === 'function') {
            showToast(errData.message || 'Failed to bind account.', 'error');
          }
          submitBtn.disabled = false;
          submitBtn.innerText = "Bind Account";
        }
      } catch (err) {
        console.error("Failed to bind account:", err);
        if (typeof showToast === 'function') {
          showToast('Network error. Please try again.', 'error');
        }
        submitBtn.disabled = false;
        submitBtn.innerText = "Bind Account";
      }
    }

    document.addEventListener('DOMContentLoaded', fetchUserBankCard);
  </script>

</body>
</html>
