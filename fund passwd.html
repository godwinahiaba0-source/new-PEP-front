<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fund Password - Pepsi VIP</title>
  <!-- Font Awesome for Navigation Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f7f9fa;
      color: #333333;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100vw;
      max-width: 480px;
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 80px;
    }

    .header {
      background: linear-gradient(135deg, #ff5722, #ff7043);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .back-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .header-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .form-wrapper {
      padding: 20px 16px;
    }

    /* REAL-TIME USER BAR */
    .user-profile-bar {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .user-phone {
      font-weight: 700;
      color: #1a202c;
    }

    .user-status {
      font-size: 0.75rem;
      color: #718096;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
      background-color: #edf2f7;
      color: #4a5568;
    }

    .status-badge.configured {
      background-color: #c6f6d5;
      color: #22543d;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: #ffffff;
      color: #1a202c;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      border-color: #ff5722;
      box-shadow: 0 0 0 3px rgba(255, 87, 34, 0.15);
    }

    .info-note {
      background-color: #fff3e0;
      border: 1px solid #ffe0b2;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.8rem;
      color: #e65100;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff5722, #ff7043);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 87, 34, 0.3);
      transition: opacity 0.2s ease;
    }

    .submit-btn:hover {
      opacity: 0.92;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* UNIFORM BOTTOM NAVIGATION BAR */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 6px 0;
      border-top: 1px solid #e2e8f0;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #64748b;
      font-size: 11px;
      flex: 1;
    }

    .nav-item i {
      font-size: 18px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #ff5722;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <a href="me.html" class="back-btn">❮</a>
      <span class="header-title">Set Fund Password</span>
      <div style="width: 16px;"></div>
    </div>

    <div class="form-wrapper">
      <!-- Real-Time Target System User Account Card -->
      <div class="user-profile-bar" id="userProfileBar">
        <div class="user-info">
          <span class="user-phone" id="displayUserPhone">Loading account...</span>
          <span class="user-status" id="displayUserId">System ID: --</span>
        </div>
        <span class="status-badge" id="displayFundStatus">Checking...</span>
      </div>

      <div class="info-note">
        Your Fund Password is required to authorize all future withdrawals. For security, you must confirm your main Account Password to create or update it.
      </div>

      <form id="fundPasswordForm" onsubmit="handleSaveFundPassword(event)">
        <div class="form-group">
          <label class="form-label" for="accountPassword">Account Login Password</label>
          <input type="password" id="accountPassword" class="form-control" placeholder="Enter main account password" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="newFundPassword">New Fund Password</label>
          <input type="password" id="newFundPassword" class="form-control" placeholder="Enter fund password (4-6 digits)" required minlength="4" maxlength="6" inputmode="numeric" pattern="\d{4,6}" />
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmFundPassword">Confirm Fund Password</label>
          <input type="password" id="confirmFundPassword" class="form-control" placeholder="Re-enter fund password" required minlength="4" maxlength="6" inputmode="numeric" pattern="\d{4,6}" />
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Save Fund Password</button>
      </form>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <a href="home.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a href="invite.html" class="nav-item">
        <i class="fa-solid fa-user-group"></i>
        <span>Team</span>
      </a>
      <a href="device.html" class="nav-item">
        <i class="fa-solid fa-headset"></i>
        <span>Device</span>
      </a>
      <a href="profit.html" class="nav-item">
        <i class="fa-solid fa-chart-column"></i>
        <span>Profit</span>
      </a>
      <a href="me.html" class="nav-item active">
        <i class="fa-solid fa-user"></i>
        <span>My</span>
      </a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="toast.js"></script>

  <script>
    function notifyUser(message, type = 'info') {
      if (typeof showToast === 'function') {
        showToast(message, type);
      } else {
        alert(message);
      }
    }

    function getBaseUrl() {
      return typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'https://pep-back-production.up.railway.app';
    }

    function getAuthToken() {
      return localStorage.getItem('userToken') || localStorage.getItem('token');
    }

    // REAL-TIME USER DETAIL FETCH & SYSTEM STORE
    async function fetchAndStoreUserProfile() {
      const token = getAuthToken();
      if (!token) {
        notifyUser('Session expired. Please log in again.', 'error');
        window.location.href = 'login.html';
        return;
      }

      try {
        const response = await fetch(`https://pep-back-production.up.railway.app/api/user/profile`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        const data = await response.json();

        if (response.ok && data.success) {
          const user = data.user;
          
          // Store user details in session system state
          sessionStorage.setItem('pepsi_user_system_data', JSON.stringify({
            id: user.id,
            phone: user.phone,
            isFundPasswordSet: user.hasFundPassword,
            updatedAt: new Date().toISOString()
          }));

          // Render system details in real-time UI
          document.getElementById('displayUserPhone').innerText = user.phone || 'User Account';
          document.getElementById('displayUserId').innerText = `ID: ${user.id}`;
          
          const statusBadge = document.getElementById('displayFundStatus');
          if (user.hasFundPassword) {
            statusBadge.innerText = 'Password Set';
            statusBadge.classList.add('configured');
          } else {
            statusBadge.innerText = 'Not Set';
            statusBadge.classList.remove('configured');
          }
        } else {
          notifyUser(data.message || 'Unable to retrieve user details.', 'error');
        }
      } catch (err) {
        console.error('Real-time system detail fetch error:', err);
      }
    }

    async function handleSaveFundPassword(event) {
      event.preventDefault();

      const accountPassword = document.getElementById('accountPassword').value.trim();
      const newFundPassword = document.getElementById('newFundPassword').value.trim();
      const confirmFundPassword = document.getElementById('confirmFundPassword').value.trim();
      const submitBtn = document.getElementById('submitBtn');

      if (!/^\d{4,6}$/.test(newFundPassword)) {
        notifyUser('Fund password must be 4-6 numeric digits.', 'error');
        return;
      }

      if (newFundPassword !== confirmFundPassword) {
        notifyUser('Fund passwords do not match.', 'error');
        return;
      }

      const token = getAuthToken();
      submitBtn.disabled = true;
      submitBtn.innerText = 'Saving...';

      try {
        const response = await fetch(`https://pep-back-production.up.railway.app/api/auth/set-fund-password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ 
            accountPassword, 
            fundPassword: newFundPassword, 
            confirmFundPassword 
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Update local system state flag securely without saving plain text password
          const systemData = JSON.parse(sessionStorage.getItem('pepsi_user_system_data') || '{}');
          systemData.isFundPasswordSet = true;
          sessionStorage.setItem('pepsi_user_system_data', JSON.stringify(systemData));

          notifyUser('Fund password updated successfully!', 'success');
          setTimeout(() => {
            window.location.href = 'me.html';
          }, 1200);
        } else {
          notifyUser(data.message || 'Failed to update fund password.', 'error');
        }
      } catch (err) {
        console.error('Backend request error:', err);
        notifyUser('Server communication error.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Save Fund Password';
      }
    }

    document.addEventListener('DOMContentLoaded', fetchAndStoreUserProfile);
  </script>
</body>
</html>
