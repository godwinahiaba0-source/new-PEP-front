<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pepsi VIP - Admin Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-card { background-color: #111827; border: 1px solid #1f2937; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .logo-area { text-align: center; margin-bottom: 24px; }
    .logo-area img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; margin-bottom: 10px; }
    h1 { font-size: 1.4rem; color: #38bdf8; margin-bottom: 6px; text-align: center; }
    p.sub { font-size: 0.85rem; color: #9ca3af; text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; color: #9ca3af; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 14px; background-color: #030712; border: 1px solid #374151; border-radius: 6px; color: #fff; font-size: 0.95rem; }
    input:focus { border-color: #38bdf8; outline: none; }
    .btn { width: 100%; background-color: #0284c7; color: #fff; border: none; padding: 11px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: 0.2s; margin-top: 6px; }
    .btn:hover { background-color: #0369a1; }
    #errorAlert { display: none; background: #7f1d1d; border: 1px solid #f87171; color: #fca5a5; padding: 10px; border-radius: 6px; margin-bottom: 16px; font-size: 0.85rem; text-align: center; font-weight: 600; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-area">
      <h1>Admin Portal</h1>
      <p class="sub">Enter your admin credentials to proceed</p>
    </div>

    <div id="errorAlert">Network error. Please check your connection.</div>

    <form onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter admin username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="loginBtn">Login to Dashboard</button>
    </form>
  </div>

  <script>
    // Dynamic API Endpoint Resolver (Local vs Production Railway)
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? "http://localhost:8080"
      : "https://pep-back-production.up.railway.app";

    async function handleAdminLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const alertBox = document.getElementById('errorAlert');
      const btn = document.getElementById('loginBtn');

      alertBox.style.display = 'none';
      btn.innerText = 'Authenticating...';
      btn.disabled = true;

      try {
        const response = await fetch(`${API_BASE}/api/auth/admin-login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameInput, password: passwordInput })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          const token = data.token || data.accessToken || data.jwt;
          if (token) {
            localStorage.setItem('adminToken', token);
            localStorage.setItem('token', token);
          }
          window.location.href = 'panel-dwhvfkn-fhf.ctrl.ctrlccf.fgycbg.html'; // Adjust to your admin control center filename if different
        } else {
          alertBox.innerText = data.message || 'Invalid username or password.';
          alertBox.style.display = 'block';
          btn.innerText = 'Login to Dashboard';
          btn.disabled = false;
        }
      } catch (err) {
        console.error('Login error:', err);
        alertBox.innerText = 'Network error. Unable to reach backend server.';
        alertBox.style.display = 'block';
        btn.innerText = 'Login to Dashboard';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
