<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accounting Records - Pepsi VIP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f7f9fa;
      color: #111827;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100vw;
      max-width: 480px;
      background-color: #f7f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 14px;
      padding-bottom: 80px;
    }

    /* HEADER BAR */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .back-btn {
      color: #111827;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .header-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* TRANSACTION LIST */
    .record-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* REDUCED SIZE CARD DESIGN */
    .record-card {
      background: #ffffff;
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
    }

    .record-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    /* SUBTLE DESCRIPTIONS */
    .record-title {
      font-weight: 500;
      color: #333333;
      font-size: 0.78rem;
      word-break: break-all;
    }

    .record-date {
      color: #aaaaaa;
      font-size: 0.72rem;
      white-space: nowrap;
      margin-left: 8px;
    }

    .record-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .record-amount {
      font-size: 0.95rem;
      font-weight: 600;
      color: #00bcd4; /* Cyan blue for credits */
    }

    .record-amount.debit {
      color: #e57373; /* Red for debits */
    }

    .record-status {
      color: #aaaaaa;
      font-size: 0.75rem;
    }

    .no-more {
      text-align: center;
      color: #cccccc;
      font-size: 0.75rem;
      margin-top: 20px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Top Header -->
    <div class="header">
      <a href="me.html" class="back-btn">❮</a>
      <span class="header-title">Accounting Records</span>
      <div style="width: 16px;"></div>
    </div>

    <!-- Unified Accumulated Record Stream -->
    <div id="recordList" class="record-list">
      <div style="text-align:center; padding: 20px; color: #aaaaaa; font-size: 0.8rem;">Loading transactions...</div>
    </div>

    <div class="no-more">No more data</div>

  </div>

  <script src="toast.js"></script>

  <script>
    function getApiBaseUrl() {
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    return 'http://localhost:8080';
  }
  return 'pep-back-production.up.railway.app';
}

    async function fetchAccountingRecords() {
      const token = localStorage.getItem('userToken') || localStorage.getItem('token');
      
      if (!token) {
        window.location.href = 'welcome.html';
        return;
      }

      const baseUrl = getApiBaseUrl();

try {
  const response = await fetch(`${baseUrl}/api/accounting`, {
    method: 'GET',
    headers: {
      'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.status === 401 || response.status === 403) {
          localStorage.removeItem('userToken');
          localStorage.removeItem('token');
          window.location.href = 'welcome.html';
          return;
        }

        if (response.ok) {
          const data = await response.json();
          const records = Array.isArray(data) ? data : (data.records || data.data || []);
          renderAccountingRecords(records);
        } else {
          renderAccountingRecords([]);
          if (typeof showToast === 'function') {
            showToast("Failed to fetch accounting records.", "error");
          }
        }
      } catch (error) {
        console.error("Error fetching user accounting records:", error);
        renderAccountingRecords([]);
      }
    }

    function renderAccountingRecords(records) {
      const container = document.getElementById('recordList');
      container.innerHTML = '';

      if (!records || records.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 20px; color: #aaaaaa; font-size: 0.8rem;">No records found.</div>';
        return;
      }

      records.forEach(tx => {
        const card = document.createElement('div');
        card.className = 'record-card';

        const isDebit = tx.isDebit || tx.type === 'debit' || tx.type === 'withdrawal' || (typeof tx.amount === 'number' && tx.amount < 0) || (typeof tx.amount === 'string' && tx.amount.startsWith('-'));
        const amountClass = isDebit ? 'record-amount debit' : 'record-amount';

        let formattedAmount = tx.amount;
        if (typeof tx.amount === 'number') {
          formattedAmount = (isDebit ? '-' : '+') + Math.abs(tx.amount).toFixed(2);
        } else if (typeof tx.amount === 'string' && !tx.amount.startsWith('+') && !tx.amount.startsWith('-')) {
          formattedAmount = (isDebit ? '-' : '+') + parseFloat(tx.amount || 0).toFixed(2);
        }

        const title = tx.title || tx.description || tx.type || 'Transaction';
        const txId = tx.id ? ` (${tx.id})` : '';
        const dateStr = tx.date || tx.created_at || 'N/A';
        const statusStr = tx.status || 'success';

        card.innerHTML = `
          <div class="record-top">
            <span class="record-title">${title}${txId}</span>
            <span class="record-date">${dateStr}</span>
          </div>
          <div class="record-bottom">
            <span class="${amountClass}">${formattedAmount}</span>
            <span class="record-status">${statusStr}</span>
          </div>
        `;

        container.appendChild(card);
      });
    }

    window.onload = fetchAccountingRecords;
  </script>

</body>
</html>
