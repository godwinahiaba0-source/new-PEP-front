<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Members - Pepsi VIP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f7f9fa; display: flex; justify-content: center; min-height: 100vh; color: #333; }
    .app-container { width: 100%; max-width: 480px; background: #f4f6f9; min-height: 100vh; display: flex; flex-direction: column; }
    
    .header { background: #5541ca; color: #fff; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: sticky; top: 0; z-index: 10; }
    .back-btn { font-size: 1.2rem; color: #fff; cursor: pointer; text-decoration: none; }
    .header-title { font-size: 1.05rem; font-weight: 600; }

    .tabs-header { display: flex; background: #ffffff; padding: 10px 0; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .tab-item { flex: 1; text-align: center; font-size: 0.9rem; font-weight: 600; color: #718096; padding: 8px 0; cursor: pointer; position: relative; }
    .tab-item.active { color: #5541ca; }
    .tab-item.active::after { content: ''; position: absolute; bottom: 0; left: 25%; width: 50%; height: 3px; background-color: #5541ca; border-radius: 2px; }

    .content { padding: 16px; flex: 1; }
    .member-card { background: #ffffff; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; }
    .member-info { display: flex; flex-direction: column; gap: 4px; }
    .member-phone { font-size: 0.95rem; font-weight: 700; color: #2d3748; }
    .member-date { font-size: 0.75rem; color: #a0aec0; }
    .member-meta { text-align: right; display: flex; flex-direction: column; gap: 4px; }
    .member-badge { font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 12px; background: #ebf8ff; color: #3182ce; display: inline-block; }
    .member-deposit { font-size: 0.85rem; font-weight: 700; color: #38a169; }

    .empty-msg { text-align: center; color: #a0aec0; padding: 40px 0; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <a class="back-btn" href="invite.html">❮</a>
      <span class="header-title">Team Members</span>
      <span style="width: 20px;"></span>
    </div>

    <div class="tabs-header">
      <div class="tab-item active" onclick="switchTab(1, this)">Level 1</div>
      <div class="tab-item" onclick="switchTab(2, this)">Level 2</div>
      <div class="tab-item" onclick="switchTab(3, this)">Level 3</div>
    </div>

    <div class="content">
      <div id="members-list">
        <p class="empty-msg">Loading team members...</p>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    let allMembers = [];
    let currentLevel = 1;

    function resolveBaseUrl() {
      if (typeof API_BASE_URL !== 'undefined' && API_BASE_URL) return API_BASE_URL;
      return (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:8080' : 'https://pep-back-production.up.railway.app';
    }

    async function loadTeamMembers() {
      const token = localStorage.getItem('token') || localStorage.getItem('userToken');
      const baseUrl = resolveBaseUrl();
      if (!token) {
        document.getElementById('members-list').innerHTML = '<p class="empty-msg">Please log in to view team members.</p>';
        return;
      }

      try {
        const res = await fetch(`${baseUrl}/api/user/team/members`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          const data = await res.json();
          allMembers = data.members || [];
          renderMembers();
        } else {
          document.getElementById('members-list').innerHTML = '<p class="empty-msg">Failed to load team members.</p>';
        }
      } catch (err) {
        document.getElementById('members-list').innerHTML = '<p class="empty-msg">Network error loading team members.</p>';
      }
    }

    function switchTab(level, element) {
      currentLevel = level;
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      element.classList.add('active');
      renderMembers();
    }

    function renderMembers() {
      const container = document.getElementById('members-list');
      const filtered = allMembers.filter(m => parseInt(m.level) === currentLevel);

      if (filtered.length === 0) {
        container.innerHTML = `<p class="empty-msg">No members found in Level ${currentLevel}.</p>`;
        return;
      }

      container.innerHTML = '';
      filtered.forEach(m => {
        const dateStr = m.created_at ? new Date(m.created_at).toISOString().split('T')[0] : 'N/A';
        const vipDisplay = `VIP ${m.vip_level !== undefined && m.vip_level !== null ? m.vip_level : 0}`;
        
        const card = document.createElement('div');
        card.className = 'member-card';
        card.innerHTML = `
          <div class="member-info">
            <span class="member-phone">${m.phone || 'N/A'}</span>
            <span class="member-date">Joined: ${dateStr}</span>
          </div>
          <div class="member-meta">
            <span class="member-badge">${vipDisplay}</span>
            <span class="member-deposit">${parseFloat(m.total_deposited || 0).toFixed(2)} GHS</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', loadTeamMembers);
  </script>
</body>
</html>
