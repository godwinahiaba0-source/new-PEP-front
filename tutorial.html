<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recharge Tutorial - Pepsi VIP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f7f9fa; display: flex; justify-content: center; min-height: 100vh; color: #333; }
    .app-container { width: 100%; max-width: 480px; background: #f4f6f9; min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Header Bar */
    .header { background: #e4002b; color: #fff; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: sticky; top: 0; z-index: 10; }
    .back-btn { font-size: 1.2rem; color: #fff; cursor: pointer; text-decoration: none; }
    .header-title { font-size: 1.05rem; font-weight: 600; }

    /* Content Area */
    .content { padding: 16px; flex: 1; }
    .video-card { background: #ffffff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .video-title { font-size: 1rem; font-weight: 700; color: #2d3748; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .video-wrapper { width: 100%; border-radius: 8px; overflow: hidden; background: #000; }
    .video-wrapper video { width: 100%; height: auto; display: block; max-height: 380px; object-fit: contain; }
    .instruction-note { margin-top: 14px; font-size: 0.85rem; color: #718096; line-height: 1.4; background: #fff5f5; padding: 10px; border-radius: 6px; border-left: 3px solid #e4002b; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <a class="back-btn" href="me.html">❮</a>
      <span class="header-title">Recharge Tutorial</span>
      <span style="width: 20px;"></span>
    </div>

    <div class="content">
      <div class="video-card">
        <div class="video-title">
          <i class="fa-solid fa-circle-play" style="color: #e4002b;"></i>
          How to Recharge Your Account
        </div>

        <div class="video-wrapper">
          <video controls preload="metadata" poster="">
            <source src="tutorial.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>

        <div class="instruction-note">
          <i class="fa-solid fa-circle-info"></i> Watch this short video guide to learn how to make deposits and submit proof of payment correctly.
        </div>
      </div>
    </div>
  </div>
</body>
</html>
